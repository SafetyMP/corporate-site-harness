name: Bug report
description: Report incorrect harness behavior, CLI failures, or gate/digest bugs
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security-sensitive gate bypass or secret exposure,
        use a **private** security advisory instead ([SECURITY.md](../../SECURITY.md)).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands and redacted program state.
      placeholder: |
        pip install -e ".[dev]"
        corp-harness status --root …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: "corp-harness, Python, OS"
      placeholder: "0.1.0 / Python 3.12 / macOS"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `python3 -m pytest -q` (or relevant failing test) locally
        - label: This is not a security vulnerability (those go to SECURITY.md)
