name: Feature request
description: Propose a capability that fits the evidence-gated corporate/site model
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap exists for users or agents today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior. Note any phase, role, or gate impact.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - CLI (corp-harness)
        - Cursor plugin (agents/skills/rules)
        - Site template / docs
        - Swift gov-assist
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints you accept
      options:
        - label: Agents must not gain `--actor user` or invent gate PASS
        - label: Corporate root and site remain separate workspaces
        - label: I am willing to help with tests and/or an ADR if needed
